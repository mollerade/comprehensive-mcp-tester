name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Every acceptance criterion has a test
        run: npm run test:trace

      - run: npm run build

      - name: Upload build (worker.js to paste into Cloudflare, worker.mjs, index.html)
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: mcp-tester-dist
          path: dist/

  docs-lint:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: README follows the template layout
        run: npm run check:readme

      - name: Markdown style
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

      - name: Spelling
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          # The action ignores .codespellrc's skip list, so repeat it here
          skip: ./node_modules,./dist,./package-lock.json,./.git
