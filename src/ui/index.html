<!DOCTYPE html>
<html lang="en">
<head>
<!-- MCP Tester. Licensed under the PolyForm Noncommercial License 1.0.0: https://polyformproject.org/licenses/noncommercial/1.0.0
     Required Notice: Copyright 2026 Christian (https://github.com/mollerade) -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCP Tester</title>
<script>
  /* apply saved theme before first paint to avoid a flash */
  try {
    var t = localStorage.getItem('mcp_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<!-- @inline-css -->
</head>
<body>

<header class="header">
  <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Servers">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h12M3 9h12M3 13h12"/></svg>
  </button>
  <div class="header-logo">
    <svg width="20" height="20" viewBox="0 0 22 22" fill="none">
      <rect width="22" height="22" rx="5" fill="var(--accent)"/>
      <path d="M6 8.5h4M6 11h10M6 13.5h7" stroke="var(--accent-ink)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    MCP Tester <span class="app-version" id="appVersion"></span>
  </div>
  <div class="header-row">
    <div class="url-bar">
      <input type="url" id="urlInput" placeholder="https://your-server.com/mcp" spellcheck="false" autocapitalize="none" onkeydown="if(event.key==='Enter')handleConnect()">
      <button class="icon-btn" id="saveBtn" onclick="openEditorForCurrent()" title="Save this server" aria-label="Save this server">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2.5h8a1 1 0 0 1 1 1v10l-5-3-5 3v-10a1 1 0 0 1 1-1z" id="saveBtnPath"/></svg>
      </button>
    </div>
    <button class="btn btn-primary" id="connectBtn" onclick="handleConnect()">Connect</button>
    <div class="status-pill disconnected" id="statusPill">
      <span class="dot"></span>
      <span id="statusText">Disconnected</span>
    </div>
    <button class="icon-btn" id="themeBtn" onclick="cycleTheme()" title="Theme: system" aria-label="Toggle theme"></button>
  </div>
</header>

<div class="controls">
  <div class="control-group">
    Transport
    <span class="transport-chip" title="MCP Streamable HTTP — one endpoint, negotiates a JSON or an event-stream response per request. The only remote transport in the current MCP spec; stdio is local-only and legacy HTTP+SSE is deprecated.">Streamable HTTP</span>
  </div>
  <div class="control-group">
    Timeout
    <input type="number" id="timeoutInput" value="15000" min="500" step="500" title="Milliseconds before the Worker aborts the request" onchange="persistCurrent()">
  </div>
  <div class="control-group">
    Retries
    <select id="retriesSelect" title="Retries are off by default so you see real failures">
      <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>
    </select>
  </div>
  <button class="btn btn-ghost btn-sm" onclick="showHeadersModal()">Headers <span class="hdr-count" id="hdrCount" hidden>0</span></button>
  <button class="btn btn-ghost btn-sm" id="authBtn" onclick="openAuthModal()">Auth <span class="hdr-count" id="authBadge" hidden></span></button>
  <div class="proxy-badge">&#x2713; Server-side proxy</div>
  <div class="control-group" style="margin-left:auto">
    <button class="btn btn-ghost btn-sm" onclick="clearLog()">Clear Log</button>
    <button class="btn btn-ghost btn-sm" onclick="toggleSidebar()">Servers</button>
  </div>
</div>

<div class="app-body">
  <aside class="sidebar collapsed" id="sidebar">
    <div class="sidebar-header">Saved Servers
      <button class="btn btn-ghost btn-sm" onclick="openEditorNew()">+ New</button>
    </div>
    <div class="sidebar-list" id="serverList"></div>
  </aside>

  <main class="main">
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="tools" onclick="switchTab('tools')">Tools <span class="badge" id="toolsBadge">0</span></button>
      <button class="tab-btn" data-tab="resources" onclick="switchTab('resources')">Resources <span class="badge" id="resourcesBadge">0</span></button>
      <button class="tab-btn" data-tab="prompts" onclick="switchTab('prompts')">Prompts <span class="badge" id="promptsBadge">0</span></button>
      <button class="tab-btn" data-tab="compliance" onclick="switchTab('compliance')">Compliance <span class="badge" id="complianceBadge" hidden>0</span></button>
      <button class="tab-btn" data-tab="diag" onclick="switchTab('diag')">Diagnostics <span class="badge" id="diagBadge">0</span><span id="liveDot"></span></button>
      <button class="tab-btn" data-tab="log" onclick="switchTab('log')">Log <span class="badge" id="logBadge">0</span></button>
    </nav>
    <div class="tab-content" id="tabContent">
      <div class="empty-state">
        <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>
          <path d="M14 20h12M20 14v12" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Enter a server URL, pick a transport, and connect
      </div>
    </div>
  </main>
</div>

<div class="viz-tooltip" id="vizTooltip" hidden></div>
<div class="toast-wrap" id="toastWrap"></div>

<div class="modal-overlay" id="serverModal" hidden>
  <div class="modal">
    <h2 id="serverModalTitle">Save Server</h2>
    <label>Name <input type="text" id="modalName" placeholder="My MCP Server"></label>
    <label>URL <input type="url" id="modalUrl" placeholder="https://example.com/mcp" autocapitalize="none"></label>
    <label>Headers <span style="font-weight:400;color:var(--ink-muted)">(JSON, optional)</span>
      <textarea id="modalHeaders" rows="2" placeholder='{"Authorization": "Bearer ..."}'></textarea>
    </label>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="hideServerModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveServerFromModal()">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="headersModal" hidden>
  <div class="modal">
    <h2>Request Headers</h2>
    <div style="font-size:12px;color:var(--ink-muted);line-height:1.5">Sent with every request to the current server — auth tokens, API keys, correlation IDs. JSON object format.</div>
    <textarea id="headersText" rows="5" placeholder='{"Authorization": "Bearer ..."}'></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="hideHeadersModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveHeaders()">Apply</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="authModal" hidden>
  <div class="modal modal-wide" id="authModalBody"></div>
</div>

<!-- @inline-js -->
</body>
</html>
